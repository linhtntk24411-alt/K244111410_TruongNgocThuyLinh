<p>catalog-list works!</p>

<div class="container">
  <div class="wrapper">
    <div *ngFor="let cate of categories" class="category">
      <table>
        <tr>
          <td colspan="2">Ma Danh Muc</td>
          <td colspan="2">Ten Danh Muc</td>
        </tr>
        <tr>
          <td colspan="2">{{cate.CateId}}</td>
          <td colspan="2">{{cate.CateName}}</td>
        </tr>
        <tr>
          <td>Ma San Pham</td>
          <td>Ten San Pham</td>
          <td>Gia San Pham</td>
          <td>Picture</td>
        </tr>
        <tbody *ngFor="let p of cate.Products">
          <tr>
            <td>{{p.ProductId}}</td>
            <td>{{p.ProductName}}</td>
            <td>{{p.Price}}</td>
            <td>
              <img src="{{p.Image}}">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
